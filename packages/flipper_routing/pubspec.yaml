name: flipper_routing
description: A new Flutter package project.
version: 1.0.0
repository: https://github.com/yegobox/packages

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flipper_design_system: any

  flipper_dashboard: any
  flipper_login: any
  flipper_models: any
  flipper_ai_feature: any
  stacked_services: ^1.6.0
  stacked: ^3.5.0
  logger: ^2.5.0
  flipper_actionable: 0.0.1
  flipper_accounting: any
  flipper_personal: any
dependency_overrides:
  xml: ^7.0.1
  smithy:
    path: ../../open-sources/smithy
  smithy_aws:
    path: ../../open-sources/smithy_aws
  http: ^1.2.2
  meta: ^1.16.0
  web: ^1.0.0
  json_annotation: ^4.9.0
  sqlite3: ^3.3.1
  stacked: ^3.5.0
  device_info_plus: ^12.3.0
  archive: ^4.0.9
  excel:
    path: ../../open-sources/excel
  cbor: ^6.3.7
  jni: ^0.14.2
  analyzer: ">=8.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  build_runner: ^2.4.15
  stacked_generator: ^2.0.0
  # `analyzer` is pinned to 9.x in dependency_overrides above, which makes pub
  # ignore dart_style's own analyzer constraint and resolve it to the newest
  # release (needs analyzer ^13). The pair then fails to compile and takes
  # build_runner down with it. 3.1.3 is the last dart_style that spans
  # analyzer 9.
  dart_style: 3.1.3
  # Same story: mockito's builder participates in every build_runner run, and
  # the newest releases require analyzer ^13. 5.6.4 is the last one that spans
  # analyzer 9.
  mockito: 5.6.4
