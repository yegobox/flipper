name: flipper_scanner
description: A new Flutter package for QR/Barcode scanning.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flipper_localize: ^1.0.0-dev
  hooks_riverpod: ^3.5.0
   # Check latest version
  mobile_scanner: ^7.1.4
  connectivity_plus: ^7.0.0 # Check latest version
  flipper_models: any
  flipper_services: any
  flipper_ui: any
  flipper_routing: any
dependency_overrides:
  xml: ^7.0.1
  smithy:
    path: ../../open-sources/smithy
  smithy_aws:
    path: ../../open-sources/smithy_aws
  image: ^4.1.0  # match flipper_services image version
  archive: ^4.0.9  # unify archive across packages
  mime: ^2.0.0  # satisfy supabase_flutter's mime requirement
  sqlite3: ^3.3.1  # keep sqlite3 consistent
  cbor: 6.5.1 # 6.5.2 needs Dart 3.13; overrides skip the SDK check
  jni: ^0.14.2
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
