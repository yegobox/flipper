# Flipper SMS Bridge (apps/flipper_sms_bridge): the sideloaded Android
# companion that forwards bank/MoMo SMS to the data-connector.
#
# It is plain Gradle, not part of melos, so nothing else builds it:
# - every PR or push that touches it: core unit tests + a debug APK;
# - every push to main that touches it: a signed release APK, published as
#   `sms-bridge-v<smsBridgeVersion>.<run number>` (gradle.properties), then
#   added to the Atlas catalog so phones update, like Flipper on Play;
# - a `sms-bridge-v*` tag pushed by hand: the same release, at that version.
#
# No branch filter on pull_request, so stacked PRs build too.
name: SMS Bridge

on:
  pull_request:
    paths:
      - "apps/flipper_sms_bridge/**"
      - ".github/workflows/sms_bridge.yml"
  push:
    branches: [main]
    paths:
      - "apps/flipper_sms_bridge/**"
      - ".github/workflows/sms_bridge.yml"
    tags: ["sms-bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flipper_sms_bridge

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Core unit tests
        run: gradle :core:test --console=plain

      # Robolectric renders every screen state on the JVM and checks the
      # pairing flow (code grouping, link confirmation, unpair prompt).
      - name: App UI tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Android lint (report only)
        run: gradle :app:lintDebug --console=plain
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: sms-bridge-debug-apk
          path: apps/flipper_sms_bridge/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/sms-bridge-v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      # A hand-pushed tag names its version. On main it is MAJOR.MINOR from
      # gradle.properties plus the run number, which only grows, so every
      # merge is a new version without a bump commit.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/sms-bridge-v* ]]; then
            NAME="${GITHUB_REF_NAME#sms-bridge-v}"
          else
            BASE="$(sed -nE 's/^smsBridgeVersion=([0-9]+\.[0-9]+)[[:space:]]*$/\1/p' gradle.properties)"
            [[ -n "$BASE" ]] || { echo "::error::smsBridgeVersion=MAJOR.MINOR missing from gradle.properties"; exit 1; }
            NAME="$BASE.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=sms-bridge-v$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # The release key never changes: Android refuses an update signed with
      # another key, and the package is registered with it for Google's
      # developer verification. It exists only in these secrets.
      - name: Signed release APK
        env:
          SMS_BRIDGE_KEYSTORE_BASE64: ${{ secrets.SMS_BRIDGE_KEYSTORE_BASE64 }}
          SMS_BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.SMS_BRIDGE_KEYSTORE_PASSWORD }}
          SMS_BRIDGE_KEY_ALIAS: ${{ secrets.SMS_BRIDGE_KEY_ALIAS }}
          SMS_BRIDGE_KEY_PASSWORD: ${{ secrets.SMS_BRIDGE_KEY_PASSWORD }}
          SMS_BRIDGE_VERSION_CODE: ${{ github.run_number }}
          SMS_BRIDGE_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$SMS_BRIDGE_KEYSTORE_BASE64" ]; then
            echo "::error::SMS_BRIDGE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK."
            exit 1
          fi
          export SMS_BRIDGE_KEYSTORE_PATH="$RUNNER_TEMP/sms-bridge.jks"
          echo "$SMS_BRIDGE_KEYSTORE_BASE64" | base64 -d > "$SMS_BRIDGE_KEYSTORE_PATH"
          gradle :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "flipper-sms-bridge-${SMS_BRIDGE_VERSION_NAME}.apk"

      # Creates the tag on a main build. A tag made with the workflow token
      # starts no other workflow, so this never releases twice. Never
      # "latest": that belongs to Flipper's own releases in this repo.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flipper SMS Bridge ${{ steps.version.outputs.name }}
          make_latest: false
          files: apps/flipper_sms_bridge/flipper-sms-bridge-*.apk

      # A link that never changes, for Flipper's SMS Bridge page and its
      # download QR: .../releases/download/sms-bridge-latest/flipper-sms-bridge.apk
      # (the per-version releases share this repo with Flipper's own, so
      # GitHub's "latest release" can't point at the bridge).
      - name: Update the sms-bridge-latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flipper-sms-bridge-*.apk flipper-sms-bridge.apk
          gh release view sms-bridge-latest >/dev/null 2>&1 || \
            gh release create sms-bridge-latest --title "Flipper SMS Bridge (latest)" \
              --notes "Always the newest signed SMS Bridge APK. Versioned builds are under the sms-bridge-v* releases." \
              --latest=false
          gh release upload sms-bridge-latest flipper-sms-bridge.apk --clobber

  # Atlas installs and updates the bridge from its catalog; publish there as
  # soon as the release exists.
  atlas:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/atlas_android_catalog.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
