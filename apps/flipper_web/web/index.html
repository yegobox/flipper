<!DOCTYPE html><html><head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    useflipper.com is the shared onboarding for every Flipper app (POS, Books,
    HR). It is a Flutter SPA, so this <head> and the <noscript> body below are
    the only things search engines and AI crawlers can read. Keep them in sync
    with the marketing copy on yegobox.com (yegobox.company/src/lib/site.ts).
  -->
  <title>Flipper — sign up for Flipper POS, Books and HR | Yegobox</title>
  <meta name="description" content="Create your Flipper account: offline-first point of sale with inventory, accounting (Flipper Books) and HR, sharing one login on iOS, Android, Windows, macOS, Linux and the web. Tax-compliant receipts, mobile money and card payments. From RWF 5,000 a month.">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
  <link rel="canonical" href="https://useflipper.com/">
  <meta name="application-name" content="Flipper">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Flipper by Yegobox">
  <meta property="og:url" content="https://useflipper.com/">
  <meta property="og:title" content="Flipper — sign up for Flipper POS, Books and HR">
  <meta property="og:description" content="Offline-first point of sale, inventory, accounting and HR in one account, on every device.">
  <meta property="og:image" content="https://yegobox.com/opengraph-image">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flipper — sign up for Flipper POS, Books and HR">
  <meta name="twitter:description" content="Offline-first point of sale, inventory, accounting and HR in one account, on every device.">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Flipper",
    "url": "https://useflipper.com/",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "iOS, Android, Windows, macOS, Linux, Web",
    "description": "Offline-first point of sale with inventory, accounting (Flipper Books) and HR for small businesses, sharing one account on every device.",
    "offers": { "@type": "Offer", "price": "5000", "priceCurrency": "RWF", "url": "https://yegobox.com/pricing" },
    "publisher": { "@type": "Organization", "name": "Yegobox", "url": "https://yegobox.com" }
  }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flipper">
  <!-- iOS fills transparency with black: use the white-backed icon. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">

  <style>
    html, body {
      background: #06080d;
      color-scheme: dark;
      margin: 0;
    }
    flutter-view, flt-glass-pane {
      background: #06080d !important;
    }
  </style>

  <!-- Corbado Passkeys Web SDK (v2.4.0), required by the `passkeys` package.
       Vendored locally in web/bundle.js (served same-origin) and loaded before
       the Flutter app so PasskeyAuthenticator is defined when passkeys init
       runs at runApp(). Keep this version in sync with the passkeys package. -->
  <script src="bundle.js"></script>
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    /* Hand-written: flutter_native_splash is set to web: false so it cannot
       overwrite this. The landing page's ring mark (assets/icons/
       flipper-logo.svg, redrawn as FlipperMark paints it) draws itself in on
       the page's white, then Flutter's hero carries on with the same mark. */
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      background-color: #ffffff;
    }

    #splash svg {
      width: 96px;
      height: 96px;
      max-width: 28vw;
      max-height: 28vh;
    }

    #splash path {
      fill: none;
      stroke: url(#splash-ring);
      stroke-linecap: butt;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: splash-draw 0.7s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    #splash .inner {
      animation-delay: 0.25s;
    }

    @keyframes splash-draw {
      1% {
        opacity: 1;
      }
      to {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash path {
        animation: none;
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-color-scheme: dark) {
      body,
      #splash {
        background-color: #0b1220;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "";
    }
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 48 48">
      <defs>
        <linearGradient id="splash-ring" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#22D3EE"></stop>
          <stop offset="0.5" stop-color="#2563EB"></stop>
          <stop offset="1" stop-color="#4F46E5"></stop>
        </linearGradient>
      </defs>
      <path class="inner" d="M24 16.75A7.25 7.25 0 1 0 30.279 20.375" stroke-width="6" pathLength="1"></path>
      <path class="outer" d="M24 6.25A17.75 17.75 0 1 1 8.628 15.125" stroke-width="8.5" pathLength="1"></path>
    </svg>
  </div>
  
  <!-- Readable fallback for crawlers and browsers without JavaScript. -->
  <noscript>
    <main style="max-width:720px;margin:48px auto;padding:0 24px;font-family:system-ui,sans-serif;color:#e6e8ee;line-height:1.6">
      <h1>Flipper — point of sale, accounting and HR for small businesses</h1>
      <p>Flipper is an offline-first point of sale with inventory, accounting (Flipper Books) and HR that share one account on iOS, Android, Windows, macOS, Linux and the web. Every sale posts to the books automatically, receipts are tax-compliant (including Rwanda Revenue Authority EBM receipts), and it accepts cash, mobile money and card.</p>
      <p>This page is the sign-up and sign-in for every Flipper app. It needs JavaScript to run.</p>
      <ul>
        <li><a href="https://useflipper.com/signup">Create an account</a></li>
        <li><a href="https://useflipper.com/login">Sign in</a></li>
        <li><a href="https://yegobox.com/flipper">About Flipper POS</a></li>
        <li><a href="https://yegobox.com/pricing">Pricing — from RWF 5,000 a month</a></li>
        <li><a href="https://apps.apple.com/rw/app/flipperrw/id6711352372">iOS app</a>, <a href="https://play.google.com/store/apps/details?id=rw.flipper">Android app</a>, <a href="https://www.microsoft.com/store/productId/9PG12JB1WRGZ">Windows app</a></li>
      </ul>
    </main>
  </noscript>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
