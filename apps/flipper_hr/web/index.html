<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="description" content="Flipper HR — people and payroll for Flipper businesses.">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flipper HR">
  <!-- Single value, no prefers-color-scheme pair: main.dart pins the app to
       ThemeMode.light, so a dark chrome would frame a white app. -->
  <meta name="theme-color" content="#1565C0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Flipper HR</title>
  <link rel="manifest" href="manifest.json">

  <!-- Font preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      color-scheme: light;
    }
    flutter-view, flt-glass-pane {
      background: transparent !important;
    }

    /* Splash. Light only, to match ThemeMode.light in main.dart, and drawn with
       the real brand mark (web/splash_logo.png, generated by
       tool/gen_app_icons.dart from assets/hr_logo_transparent.png) so the first
       paint is the same logo the signed-in shell shows. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.3s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img {
      width: 160px;
      height: auto;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash img { animation: none; }
    }
  </style>
  <script>
    function removeSplash() {
      const el = document.getElementById('splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', removeSplash);
  </script>
</head>
<body>
  <div id="splash">
    <img src="splash_logo.png" alt="Flipper HR" width="160">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
