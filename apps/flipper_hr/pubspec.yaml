name: flipper_hr
description: "Flipper HR — web app served at hr.useflipper.com."
publish_to: 'none'

version: 1.0.15+16

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  flipper_design_system: any
  # Auth is shared with Books: HR reuses flipper_web's PIN login, signup and
  # business/branch selection so one account works in both apps.
  flipper_web: any
  flipper_analytics: any
  go_router: ^16.2.2
  # apihub is plain REST (the invite's account and PIN hops), so HR needs an
  # http client of its own rather than reaching through supabase_flutter's.
  http: ^1.2.0
  # The sidebar's expanded/collapsed choice outlives a page reload.
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # Used only by tool/gen_app_icons.dart, which builds the launcher-icon
  # masters in assets/icon/ from assets/hr_logo_transparent.png.
  image: ^4.9.1

dependency_overrides:
  # Mirrors flipper_web: both forks exist because the upstream web
  # implementations import dart:html, which dart2wasm cannot compile.
  flutter_keyboard_visibility_web:
    path: ../../open-sources/flutter_keyboard_visibility_web
  ua_client_hints:
    path: ../../open-sources/ua_client_hints
  sqlite3: ^3.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/hr_logo_transparent.png
